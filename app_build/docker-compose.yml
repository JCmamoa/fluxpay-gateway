name: fluxpay-gateway

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: fluxpay-gateway:1.0.0
    ports:
      - "${PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-demo}
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_EXPOSE_API_KEY: ${DEMO_EXPOSE_API_KEY:-true}
      HOST: 0.0.0.0
      PORT: "8000"
      DATABASE_PATH: /app/data/gateway.db
      MERCHANT_ID: ${MERCHANT_ID:-mch_demo}
      MERCHANT_NAME: ${MERCHANT_NAME:-Loja Demo}
      API_KEY: ${API_KEY:-sk_demo_fluxpay_2026}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-whsec_demo_fluxpay_2026}
      # Internal loopback URL: the simulated merchant receiver lives in this container.
      WEBHOOK_URL: ${WEBHOOK_URL:-http://127.0.0.1:8000/demo/webhook-receiver?endpoint=whe_demo}
      WEBHOOK_TIMEOUT_SECONDS: ${WEBHOOK_TIMEOUT_SECONDS:-10}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-6}
      WEBHOOK_RETRY_SCHEDULE: ${WEBHOOK_RETRY_SCHEDULE:-10,30,120,600,3600}
      WEBHOOK_JITTER_RATIO: ${WEBHOOK_JITTER_RATIO:-0.2}
      PIX_KEY: ${PIX_KEY:-demo@fluxpay.local}
      PIX_CITY: ${PIX_CITY:-SAO PAULO}
      PIX_EXPIRES_MINUTES: ${PIX_EXPIRES_MINUTES:-30}
      CARD_AUTHORIZATION_DELAY_MS: ${CARD_AUTHORIZATION_DELAY_MS:-350}
      WORKER_ENABLED: "true"
      # ---- v0.3: event hub, realtime and scheduled jobs ----
      EVENT_FANOUT: "true"
      WS_ENABLED: "true"
      WS_POLL_SECONDS: ${WS_POLL_SECONDS:-0.15}
      WS_HEARTBEAT_SECONDS: ${WS_HEARTBEAT_SECONDS:-20}
      EVENT_STREAM_RETENTION_DAYS: ${EVENT_STREAM_RETENTION_DAYS:-30}
      JOBS_SEGMENTS_SECONDS: ${JOBS_SEGMENTS_SECONDS:-60}
      JOBS_ANALYTICS_SECONDS: ${JOBS_ANALYTICS_SECONDS:-180}
      JOBS_RAG_SECONDS: ${JOBS_RAG_SECONDS:-300}
      JOBS_RETENTION_SECONDS: ${JOBS_RETENTION_SECONDS:-900}
      ANALYTICS_ROLLUP_DAYS: ${ANALYTICS_ROLLUP_DAYS:-92}
      RAG_ENABLED: "true"
      # The image ships RAG with the in-app README + event feeds. To index the
      # project specs too, bind-mount them and set RAG_SPECS_DIR, e.g.:
      #   volumes: ["./specs:/app/specs:ro"]
      #   environment: RAG_SPECS_DIR: /app/specs
      # (RAG degrades gracefully when the dir is absent.)
      AGENT_RATE_LIMIT_PER_MINUTE: ${AGENT_RATE_LIMIT_PER_MINUTE:-30}
      AGENT_CONFIRM_TTL_SECONDS: ${AGENT_CONFIRM_TTL_SECONDS:-600}
      PII_REDACT_EMAIL: ${PII_REDACT_EMAIL:-0}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - gateway_data:/app/data
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); sys.exit(0 if r.status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  gateway_data:
    name: fluxpay_gateway_data
