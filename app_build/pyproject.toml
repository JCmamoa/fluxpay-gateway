[project]
name = "fluxpay-gateway"
version = "1.0.0"
description = "Simplified payment gateway with PIX, card simulation, durable queue and signed webhooks"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning",
]
