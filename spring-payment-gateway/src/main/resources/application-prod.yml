spring:
  r2dbc:
    url: ${DB_URL:r2dbc:postgresql://localhost:5432/paymentsdb?sslMode=VERIFY_FULL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    pool:
      enabled: true
      max-size: ${DB_POOL_MAX_SIZE:30}
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/paymentsdb?sslmode=verify-full}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

app:
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME}
    password: ${BOOTSTRAP_ADMIN_PASSWORD}
  private-profile-database:
    url: ${PROFILE_DB_JDBC_URL}
    username: ${PROFILE_DB_USER}
    password: ${PROFILE_DB_PASSWORD}
  messaging:
    recovery-queue: ${RECOVERY_NOTIFICATION_QUEUE:password-recovery-notifications}
  password-recovery:
    code-lifetime: ${RECOVERY_CODE_LIFETIME:PT10M}
