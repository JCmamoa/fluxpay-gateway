server:
  port: 8080

spring:
  profiles:
    default: dev

jwt:
  secret: ${JWT_SECRET:}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

resilience4j:
  circuitbreaker:
    instances:
      externalGateway:
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 2s
        waitDurationInOpenState: 10s
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        permittedNumberOfCallsInHalfOpenState: 5
        registerHealthIndicator: true
  timelimiter:
    instances:
      externalGateway:
        timeoutDuration: 3s
  retry:
    instances:
      externalGateway:
        maxAttempts: 3
        waitDuration: 300ms
  bulkhead:
    instances:
      externalGateway:
        maxConcurrentCalls: 25
        maxWaitDuration: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,circuitbreakers
  endpoint:
    health:
      show-details: never
  health:
    circuitbreakers:
      enabled: true
